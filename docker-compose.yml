version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: unity_eoc_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: unity_eoc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unity_eoc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unity_eoc_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: unity_eoc_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/unity_eoc
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: unity-eoc-india-sovereign-national-secret-key-2026-ndma-mha
      UNITY_DEMO_MODE: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
