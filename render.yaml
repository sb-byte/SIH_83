# Render blueprint for Unity EOC FastAPI Backend API.
# Deploy: push to GitHub, then Render → New → Blueprint → pick this repo.

services:
  - type: web
    name: unity-eoc-api
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: 'pip install -r backend/requirements.txt'
    startCommand: 'uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: JWT_SECRET
        generateValue: true
      - key: UNITY_DEMO_MODE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

